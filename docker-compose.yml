services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_USER=admin
      - DATABASE_PASSWORD=secret123
      - DATABASE_HOST=mongo
      - DATABASE_PORT=27017
      - DATABASE_NAME=restaurante
      - JWT_SECRET=supersecretkey
      - CORS_ORIGIN=http://localhost:3001
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=secret123
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
